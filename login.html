<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <img src="assets/images/logo.webp" alt="Stackly logo" class="logo-img">
      <span>Stackly</span>
    </a>
    <div class="navbar-nav">
      <a href="index.html" class="nav-link">Home</a>
      <a href="about.html" class="nav-link">About</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="blog.html" class="nav-link">Blog</a>
      <a href="contact.html" class="nav-link">Contact</a>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <a href="login.html" class="nav-link active">Login</a>
    </div>
    <button class="mobile-menu-btn" aria-label="Toggle menu"><span></span><span></span><span></span></button>
  </nav>

  <!-- Login Page -->
  <div class="auth-page">
    <div class="auth-card animate-fade">
      <div class="auth-header">
        <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;font-weight:800;font-size:20px;color:var(--dark);">
          <svg viewBox="0 0 28 28" fill="none" width="28" height="28">
            <rect x="2" y="2" width="24" height="24" rx="6" fill="url(#aLogo)"/>
            <path d="M9 14l4-4 6 6m0 0l-4 4m4-4L9 14" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <defs><linearGradient id="aLogo" x1="2" y1="2" x2="26" y2="26"><stop stop-color="#1a56db"/><stop offset="1" stop-color="#0e9f6e"/></linearGradient></defs>
          </svg>
          Stackly
        </a>
        <h2>Welcome Back</h2>
        <p>Sign in to access your security dashboard</p>
        <button type="button" class="btn btn-outline btn-lg" onclick="history.back()" style="margin-top:18px;">Go Back</button>
      </div>

      <!-- Role Toggle -->
      <div class="role-toggle">
        <div class="role-option active" data-role="user">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;margin-right:6px;"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          User
        </div>
        <div class="role-option" data-role="admin">
          <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;margin-right:6px;"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
          Admin
        </div>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@company.com" required value="user@stackly.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required value="password">
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
          <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--primary);"> Remember me
          </label>
          <a href="#" style="font-size:13px;color:var(--primary);font-weight:500;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Sign In</button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a href="register.html">Get Started</a></p>
        <p style="margin-top:12px;font-size:12px;color:var(--gray-lighter);">
          Demo: Use any email/password. Select role above.
        </p>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
